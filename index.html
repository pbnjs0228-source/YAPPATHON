<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yappathon — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="yapp-dark"] {
    --bg: #14151a; --bg-alt: #1b1c22; --bg-elevated: #23242c; --bg-input:#2a2b34;
    --border: #2e2f38; --text: #ECEDEF; --text-muted: #9498A3;
    --accent: #FF7A33; --accent-hover:#FF8F52; --accent-contrast: #14151a; --accent-soft: rgba(255,122,51,0.15);
    --online: #3BA55D; --danger: #ED4245; --shadow: rgba(0,0,0,0.45);
  }
  [data-theme="yapp-light"] {
    --bg: #FBF7F2; --bg-alt: #FFFFFF; --bg-elevated: #FFFFFF; --bg-input:#F1ECE3;
    --border: #E7E1D8; --text: #2A2620; --text-muted: #837C6C;
    --accent: #E8590C; --accent-hover:#D14F0A; --accent-contrast: #FFFFFF; --accent-soft: rgba(232,89,12,0.12);
    --online: #2E9E52; --danger: #D6373B; --shadow: rgba(60,40,20,0.12);
  }
  [data-theme="midnight"] {
    --bg: #0B0F1A; --bg-alt: #101526; --bg-elevated: #161C31; --bg-input:#1B2138;
    --border: #232B45; --text: #E3E7F5; --text-muted: #838EB0;
    --accent: #7C8CFF; --accent-hover:#95A2FF; --accent-contrast: #0B0F1A; --accent-soft: rgba(124,140,255,0.15);
    --online: #3BA55D; --danger: #FF5D6C; --shadow: rgba(0,0,0,0.5);
  }
  [data-theme="forest"] {
    --bg: #101712; --bg-alt: #16211A; --bg-elevated: #1C2A21; --bg-input:#20301F;
    --border: #2B3B30; --text: #E6F0E8; --text-muted: #8FA898;
    --accent: #4FBE7B; --accent-hover:#69CE91; --accent-contrast: #0B120E; --accent-soft: rgba(79,190,123,0.15);
    --online: #7CD98A; --danger: #E4636B; --shadow: rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .brand, .logo-word { font-family: 'Sora', sans-serif; }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bubble-mark { display:inline-block; }
  .bubble-mark svg { display:block; }

  /* ---------- Auth screen ---------- */
  #auth-screen {
    height: 100%; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, var(--accent-soft), transparent 45%),
      radial-gradient(circle at 85% 80%, var(--accent-soft), transparent 45%),
      var(--bg);
    padding: 24px;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px 32px; text-align:center; box-shadow: 0 20px 60px var(--shadow);
  }
  .auth-card .bubble-mark { color: var(--accent); margin-bottom: 14px; }
  .auth-card h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .auth-card p.tag { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .google-btn {
    width: 100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background: #fff; color: #1f1f1f; border: 1px solid #d8d8d8; border-radius: 10px;
    padding: 12px 16px; font-weight: 600; font-size: 14px; transition: transform .15s ease, box-shadow .15s ease;
  }
  .google-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .auth-foot { margin-top: 18px; font-size: 12px; color: var(--text-muted); }
  #auth-error { color: var(--danger); font-size: 13px; margin-top: 14px; display:none; white-space:pre-wrap; }
  .auth-divider { display:flex; align-items:center; gap:10px; color: var(--text-muted); font-size:12px; margin: 18px 0; text-transform:uppercase; letter-spacing:.06em; }
  .auth-divider::before, .auth-divider::after { content:''; height:1px; background: var(--border); flex:1; }
  #email-auth-form { display:flex; flex-direction:column; gap:10px; text-align:left; }
  #email-auth-form input { width:100%; background: var(--bg-input); border:1px solid var(--border); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; font-family:inherit; }
  #email-auth-form input:focus { outline:none; border-color: var(--accent); }
  .auth-submit { width:100%; padding:11px 16px; font-size:14px; margin-top:2px; }
  .link-btn { background:none; border:none; color: var(--accent); font-size:12px; font-weight:600; padding:0; }
  .link-btn:hover { text-decoration: underline; }
  #auth-forgot { display:block; margin: 12px auto 0; }

  /* ---------- App shell ---------- */
  #app { display:none; height:100%; }
  #app.ready { display:grid; grid-template-columns: 240px 1fr 220px; }
  .sidebar { background: var(--bg-alt); border-right: 1px solid var(--border); display:flex; flex-direction:column; min-width:0; }
  .sidebar-header { padding: 18px 16px; display:flex; align-items:center; gap:8px; border-bottom: 1px solid var(--border); }
  .sidebar-header .bubble-mark { color: var(--accent); }
  .sidebar-header .logo-word { font-weight:800; font-size:16px; letter-spacing:-0.01em; }

  .section-label { padding: 16px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); display:flex; align-items:center; justify-content:space-between; }
  .section-label button { background:none; border:none; color: var(--text-muted); font-size:16px; line-height:1; padding:2px 6px; border-radius:6px; }
  .section-label button:hover { color: var(--accent); background: var(--accent-soft); }

  .channel-list { list-style:none; margin:0; padding: 0 8px; flex: 0 0 auto; }
  .channel-item { display:flex; align-items:center; gap:8px; padding: 8px 10px; border-radius: 8px; color: var(--text-muted); font-size: 14px; font-weight:500; cursor:pointer; margin-bottom:2px; }
  .channel-item:hover { background: var(--bg-elevated); color: var(--text); }
  .channel-item.active { background: var(--accent-soft); color: var(--text); }
  .channel-item .hash { opacity:.6; font-weight:700; }
  .games-tab { display:flex; align-items:center; gap:8px; padding:8px 10px; margin: 0 8px; border-radius:8px; color: var(--text-muted); font-size:14px; opacity:.55; cursor:default; }
  .badge-soon { font-size:9px; text-transform:uppercase; letter-spacing:.05em; background: var(--bg-elevated); border:1px solid var(--border); padding:2px 6px; border-radius:20px; margin-left:auto; }

  .sidebar-spacer { flex:1; }
  .user-panel { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--border); background: var(--bg-elevated); }
  .user-panel .meta { min-width:0; flex:1; }
  .user-panel .uname { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:4px; }
  .user-panel .urole { font-size:11px; color: var(--text-muted); }
  .icon-btn { background:none; border:none; color: var(--text-muted); padding:6px; border-radius:8px; display:flex; }
  .icon-btn:hover { background: var(--bg-input); color: var(--text); }

  .avatar { border-radius:50%; object-fit:cover; background: var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .crown { color: var(--accent); font-size:12px; }

  /* ---------- Main pane ---------- */
  .main { display:flex; flex-direction:column; min-width:0; }
  .topbar { height:56px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 18px; gap:10px; }
  .topbar .hash { color: var(--text-muted); font-weight:700; }
  .topbar .chan-name { font-weight:700; font-size:15px; }
  .topbar-spacer { flex:1; }
  .theme-picker { position:relative; }
  .theme-menu { display:none; position:absolute; right:0; top:38px; background: var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:6px; box-shadow: 0 10px 30px var(--shadow); z-index:20; min-width:150px; }
  .theme-menu.open { display:block; }
  .theme-opt { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:13px; }
  .theme-opt:hover { background: var(--bg-input); }
  .theme-opt .dot { width:10px; height:10px; border-radius:50%; }

  .messages { flex:1; overflow-y:auto; padding: 18px 22px; display:flex; flex-direction:column; gap:2px; }
  .msg-row { display:flex; gap:12px; padding:6px 8px; border-radius:10px; }
  .msg-row:hover { background: var(--bg-alt); }
  .msg-row .avatar { width:38px; height:38px; font-size:14px; margin-top:2px; }
  .msg-body { min-width:0; flex:1; }
  .msg-head { display:flex; align-items:baseline; gap:8px; }
  .msg-uname { font-weight:700; font-size:14px; }
  .msg-uname.admin { color: var(--accent); }
  .msg-time { font-size:11px; color: var(--text-muted); font-family:'JetBrains Mono', monospace; }
  .msg-text { font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .msg-img { margin-top:6px; max-width:320px; max-height:320px; border-radius:10px; border:1px solid var(--border); cursor:zoom-in; display:block; }
  .msg-del { background:none; border:none; color:var(--text-muted); opacity:0; font-size:12px; margin-left:auto; align-self:flex-start; }
  .msg-row:hover .msg-del { opacity:1; }
  .msg-del:hover { color: var(--danger); }
  .day-divider { display:flex; align-items:center; gap:10px; color: var(--text-muted); font-size:11px; margin: 14px 0 8px; text-transform:uppercase; letter-spacing:.06em; }
  .day-divider::before, .day-divider::after { content:''; height:1px; background: var(--border); flex:1; }
  .empty-state { margin:auto; text-align:center; color: var(--text-muted); }
  .empty-state .bubble-mark { color: var(--accent); opacity:.5; margin-bottom:10px; }

  .composer { padding: 12px 18px 18px; }
  .composer-inner { background: var(--bg-input); border:1px solid var(--border); border-radius:14px; display:flex; align-items:flex-end; gap:8px; padding:8px 10px; }
  .composer-inner textarea { flex:1; resize:none; background:none; border:none; color:var(--text); font-family:inherit; font-size:14px; padding:8px 4px; max-height:140px; }
  .composer-inner textarea:focus { outline:none; }
  .composer-inner .icon-btn { flex-shrink:0; }
  .img-preview-wrap { display:flex; align-items:center; gap:8px; padding: 0 4px 8px; }
  .img-preview-wrap img { height:52px; width:52px; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
  .img-preview-wrap button { background:none; border:none; color:var(--text-muted); font-size:12px; }

  /* ---------- Members ---------- */
  .members { background: var(--bg-alt); border-left:1px solid var(--border); overflow-y:auto; padding: 16px 12px; }
  .members h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color: var(--text-muted); margin: 6px 8px 10px; }
  .member-row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; }
  .member-row:hover { background: var(--bg-elevated); }
  .member-row .avatar { width:32px; height:32px; font-size:12px; position:relative; }
  .status-dot { width:10px; height:10px; border-radius:50%; position:absolute; bottom:-1px; right:-1px; border:2px solid var(--bg-alt); }
  .status-dot.online { background: var(--online); }
  .status-dot.offline { background: var(--text-muted); }
  .member-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:4px; }
  .member-name.admin { color: var(--accent); }

  /* ---------- Modal ---------- */
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.open { display:flex; }
  .modal { background: var(--bg-elevated); border:1px solid var(--border); border-radius:16px; width:100%; max-width:400px; padding:24px; box-shadow: 0 20px 60px var(--shadow); }
  .modal h2 { font-size:17px; margin:0 0 18px; }
  .modal label { font-size:12px; color: var(--text-muted); display:block; margin-bottom:6px; margin-top:14px; }
  .modal input[type=text] { width:100%; background: var(--bg-input); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
  .modal input[type=text]:focus { outline:none; border-color: var(--accent); }
  .modal-avatar-row { display:flex; align-items:center; gap:14px; margin-top:8px; }
  .modal-avatar-row .avatar { width:60px; height:60px; font-size:20px; }
  .upload-btn { background: var(--bg-input); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; font-size:13px; }
  .upload-btn:hover { border-color: var(--accent); }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .btn { padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid var(--border); background:none; color:var(--text); }
  .btn:hover { background: var(--bg-input); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger-ghost { color: var(--danger); border-color: transparent; }
  .modal-err { font-size:12px; color:var(--danger); margin-top:10px; display:none; }

  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); align-items:center; justify-content:center; z-index:200; cursor:zoom-out; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; }

  .toasts { position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:300; }
  .toast { background: var(--bg-elevated); border:1px solid var(--border); border-left:3px solid var(--danger); padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 10px 30px var(--shadow); max-width:280px; }
  .toast.info { border-left-color: var(--accent); }

  @media (max-width: 860px) {
    #app.ready { grid-template-columns: 0 1fr 0; }
    .sidebar, .members { position:fixed; top:0; bottom:0; z-index:50; width:240px; transition:transform .2s ease; }
    .sidebar { left:0; transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .members { right:0; width:220px; transform:translateX(100%); }
    .members.open { transform:translateX(0); }
  }
</style>
</head>
<body data-theme="yapp-dark">

<!-- ===== Auth screen ===== -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="bubble-mark">
      <svg width="44" height="44" viewBox="0 0 64 64" fill="none"><path d="M8 16C8 11.58 11.58 8 16 8H48C52.42 8 56 11.58 56 16V36C56 40.42 52.42 44 48 44H26L14 54V44H16C11.58 44 8 40.42 8 36V16Z" fill="currentColor"/><circle cx="21" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="32" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="43" cy="26" r="3.4" fill="var(--bg-alt)"/></svg>
    </div>
    <h1 class="brand">Yappathon</h1>
    <p class="tag">Sign in to start chatting</p>
    <button class="google-btn" id="google-signin">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.5 26.9 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.7 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.4C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="email-auth-form" autocomplete="on">
      <div id="signup-username-wrap" style="display:none;">
        <input type="text" id="auth-username" placeholder="Username" maxlength="24" autocomplete="username" />
      </div>
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required />
      <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="btn primary auth-submit" id="auth-submit-btn">Sign in</button>
    </form>
    <button type="button" id="auth-forgot" class="link-btn">Forgot password?</button>

    <div id="auth-error"></div>
    <div id="config-banner" style="display:none; margin-top:16px; text-align:left; background: var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.5; color: var(--text);"></div>
    <p class="auth-foot">
      <span id="auth-toggle-text">Need an account?</span>
      <button type="button" id="auth-toggle-btn" class="link-btn">Sign up</button>
    </p>
  </div>
</div>

<!-- ===== App shell ===== -->
<div id="app-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:999; background:var(--danger); color:#fff; font-size:13px; padding:10px 16px; text-align:center;"></div>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="bubble-mark" style="width:20px;height:20px;">
        <svg width="20" height="20" viewBox="0 0 64 64" fill="none"><path d="M8 16C8 11.58 11.58 8 16 8H48C52.42 8 56 11.58 56 16V36C56 40.42 52.42 44 48 44H26L14 54V44H16C11.58 44 8 40.42 8 36V16Z" fill="currentColor"/><circle cx="21" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="32" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="43" cy="26" r="3.4" fill="var(--bg-alt)"/></svg>
      </span>
      <span class="logo-word">Yappathon</span>
    </div>

    <div class="section-label">Channels <button id="add-channel-btn" title="Create channel">+</button></div>
    <ul class="channel-list" id="channel-list"></ul>

    <div class="section-label" style="margin-top:6px;">Games</div>
    <div class="games-tab"><span>🎮</span> Multiplayer Games <span class="badge-soon">Soon</span></div>

    <div class="sidebar-spacer"></div>

    <div class="user-panel">
      <img class="avatar" id="me-avatar" width="34" height="34" style="width:34px;height:34px;" />
      <div class="meta">
        <div class="uname" id="me-name"></div>
        <div class="urole" id="me-role"></div>
      </div>
      <button class="icon-btn" id="open-settings" title="Settings">⚙️</button>
      <button class="icon-btn" id="sign-out" title="Sign out">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="mobile-sidebar-toggle" style="display:none;">☰</button>
      <span class="hash">#</span><span class="chan-name" id="chan-name">general</span>
      <div class="topbar-spacer"></div>
      <div class="theme-picker">
        <button class="icon-btn" id="theme-btn" title="Theme">🎨</button>
        <div class="theme-menu" id="theme-menu">
          <div class="theme-opt" data-theme="yapp-dark"><span class="dot" style="background:#FF7A33"></span>Yapp Dark</div>
          <div class="theme-opt" data-theme="yapp-light"><span class="dot" style="background:#E8590C"></span>Yapp Light</div>
          <div class="theme-opt" data-theme="midnight"><span class="dot" style="background:#7C8CFF"></span>Midnight</div>
          <div class="theme-opt" data-theme="forest"><span class="dot" style="background:#4FBE7B"></span>Forest</div>
        </div>
      </div>
      <button class="icon-btn" id="mobile-members-toggle" style="display:none;">👥</button>
    </div>

    <div class="messages" id="messages"><div class="empty-state">Loading…</div></div>

    <div class="composer">
      <div class="img-preview-wrap" id="img-preview-wrap" style="display:none;">
        <img id="img-preview" /><button id="img-preview-clear">Remove</button>
      </div>
      <div class="composer-inner">
        <button class="icon-btn" id="attach-btn" title="Attach image">📎</button>
        <input type="file" id="file-input" accept="image/*" style="display:none;" />
        <textarea id="msg-input" rows="1" placeholder="Message #general"></textarea>
        <button class="icon-btn" id="send-btn" title="Send">➤</button>
      </div>
    </div>
  </main>

  <aside class="members" id="members">
    <h3 id="member-count">Members</h3>
    <div id="member-list"></div>
  </aside>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  signOut, onAuthStateChanged,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, limit, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4rfKO1U_LAxKyrIrQuRXeI1saokMInhA",
  authDomain: "orangefox-ce8b1.firebaseapp.com",
  projectId: "orangefox-ce8b1",
  storageBucket: "orangefox-ce8b1.firebasestorage.app",
  messagingSenderId: "859089557525",
  appId: "1:859089557525:web:2852c1975458b867cc561c",
  measurementId: "G-LLB6S2MVB5"
};

const ADMIN_EMAIL = "admin@yappathon.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

// ---------- config self-check ----------
// Surfaces a clear, actionable message instead of a wall of console errors
// when the deployed domain hasn't been added to Firebase yet.
function showConfigBanner(html) {
  const el = document.getElementById('config-banner');
  if (!el) return;
  el.innerHTML = html;
  el.style.display = 'block';
}
function showAppBanner(html) {
  const el = document.getElementById('app-banner');
  if (!el) return;
  el.innerHTML = html;
  el.style.display = 'block';
}
const currentDomain = location.hostname;

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
function toast(msg, type="danger") {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'info' ? ' info' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
function hashHue(str) {
  let h = 0;
  for (let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  return Math.abs(h) % 360;
}
function initials(name) {
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function renderAvatar(imgEl, user) {
  if (user.photoBase64) {
    imgEl.src = user.photoBase64;
    imgEl.style.background = 'none';
  } else {
    const hue = hashHue(user.uid || user.username || 'x');
    const size = imgEl.width || 34;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><rect width="100%" height="100%" rx="${size}" fill="hsl(${hue},70%,42%)"/><text x="50%" y="53%" font-family="Sora,sans-serif" font-size="${size*0.4}" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-weight="700">${initials(user.username)}</text></svg>`;
    imgEl.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  }
}
function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That doesn't look like a valid image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = height * maxDim / width; width = maxDim; }
        else if (height > maxDim) { width = width * maxDim / height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- state ----------
let currentUser = null;   // firebase auth user
let profile = null;       // firestore users/{uid} doc data
let pendingSignupUsername = null; // staged username during email/password signup
let authMode = 'signin';  // 'signin' | 'signup'
let userCache = {};        // uid -> profile, live-updated
let currentChannel = 'general';
let unsubMessages = null;
let unsubChannels = null;
let unsubMembers = null;
let pendingImage = null;   // data URL staged for next message

const DEFAULT_CHANNELS = ['general', 'random'];

// ---------- auth ----------
$('google-signin').addEventListener('click', async () => {
  $('auth-error').style.display = 'none';
  document.getElementById('config-banner').style.display = 'none';
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e.code || '';
    // Popup-based sign-in fails outright on unauthorized domains, and
    // popups themselves get blocked in a lot of embedded/webview contexts.
    // Redirect-based sign-in is more forgiving of the latter, so try it
    // as a fallback — but unauthorized-domain will still fail on redirect
    // too, so surface the real fix for that one instead of retrying blind.
    if (code.includes('unauthorized-domain')) {
      showAuthDomainBanner();
      return;
    }
    if (code.includes('popup-blocked') || code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) {
      try {
        await signInWithRedirect(auth, provider);
        return; // page will navigate away
      } catch (e2) {
        showAuthError(friendlyAuthError(e2));
        return;
      }
    }
    showAuthError(friendlyAuthError(e));
  }
});
$('sign-out').addEventListener('click', () => signOut(auth));

// Catch the result if we fell back to a redirect sign-in above.
getRedirectResult(auth).catch((e) => {
  if (e && e.code === 'auth/unauthorized-domain') showAuthDomainBanner();
  else if (e) showAuthError(friendlyAuthError(e));
});

let firestoreRulesBannerShown = false;
function handleFirestoreError(context) {
  return (e) => {
    if (e && e.code === 'permission-denied') {
      if (!firestoreRulesBannerShown) {
        firestoreRulesBannerShown = true;
        showAppBanner(
          `Firestore permissions are blocking reads/writes. Update your
           <strong>Firestore → Rules</strong> to allow signed-in users
           (e.g. <code>allow read, write: if request.auth != null;</code>), then reload.`
        );
      }
      return;
    }
    toast(`Couldn't load ${context}.`);
  };
}

function showAuthDomainBanner() {
  showConfigBanner(
    `<strong>This domain isn't authorized for sign-in yet.</strong><br>
     Add <code>${escapeHtml(currentDomain)}</code> to
     <strong>Firebase Console → Authentication → Settings → Authorized domains</strong>,
     then reload this page. Email/password sign-in below isn't affected by this.`
  );
}

function friendlyAuthError(e) {
  const code = e.code || '';
  if (code.includes('unauthorized-domain')) return `This domain (${currentDomain}) isn't authorized in Firebase yet — see the note above.`;
  if (code.includes('email-already-in-use')) return 'An account with that email already exists — try signing in instead.';
  if (code.includes('invalid-email')) return 'That email address doesn\'t look right.';
  if (code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if (code.includes('user-not-found') || code.includes('invalid-credential') || code.includes('wrong-password')) return 'Incorrect email or password.';
  if (code.includes('too-many-requests')) return 'Too many attempts — please wait a moment and try again.';
  if (code.includes('popup-closed-by-user')) return 'Sign-in was cancelled.';
  if (code.includes('network-request-failed')) return 'Network error — check your connection and try again.';
  return e.message || 'Something went wrong — please try again.';
}
function showAuthError(msg) {
  const el = $('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function setAuthMode(mode) {
  authMode = mode;
  const isSignup = mode === 'signup';
  $('signup-username-wrap').style.display = isSignup ? 'block' : 'none';
  $('auth-username').required = isSignup;
  $('auth-password').setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');
  $('auth-submit-btn').textContent = isSignup ? 'Sign up' : 'Sign in';
  $('auth-toggle-text').textContent = isSignup ? 'Already have an account?' : 'Need an account?';
  $('auth-toggle-btn').textContent = isSignup ? 'Sign in' : 'Sign up';
  $('auth-error').style.display = 'none';
}
$('auth-toggle-btn').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));

$('email-auth-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('auth-error').style.display = 'none';
  const email = $('auth-email').value.trim();
  const password = $('auth-password').value;
  const username = $('auth-username').value.trim();
  const btn = $('auth-submit-btn');
  btn.disabled = true;
  try {
    if (authMode === 'signup') {
      if (username.length < 2) { showAuthError('Pick a username with at least 2 characters.'); return; }
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      pendingSignupUsername = username;
      await updateProfile(cred.user, { displayName: username }).catch(()=>{});
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  } finally {
    btn.disabled = false;
  }
});

$('auth-forgot').addEventListener('click', async () => {
  const email = $('auth-email').value.trim();
  if (!email) { showAuthError('Enter your email above first, then hit "Forgot password?"'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    $('auth-error').style.color = 'var(--online)';
    showAuthError('Password reset email sent — check your inbox.');
    $('auth-error').style.color = '';
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    currentUser = null; profile = null;
    $('auth-screen').style.display = 'flex';
    $('app').classList.remove('ready');
    if (unsubMessages) unsubMessages();
    if (unsubChannels) unsubChannels();
    if (unsubMembers) unsubMembers();
    return;
  }
  currentUser = user;
  try {
    await ensureUserDoc(user, pendingSignupUsername);
    pendingSignupUsername = null;
    await ensureDefaultChannels();
    $('auth-screen').style.display = 'none';
    $('app').classList.add('ready');
    listenProfile(user.uid);
    listenChannels();
    listenMembers();
    switchChannel('general');
    heartbeat();
    setInterval(heartbeat, 25000);
  } catch (e) {
    console.error(e);
    if (e && e.code === 'permission-denied') {
      handleFirestoreError('your account')(e);
    } else {
      toast("Couldn't set up your account: " + e.message);
    }
  }
});

async function ensureUserDoc(user, explicitUsername) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    const role = user.email === ADMIN_EMAIL ? 'admin' : 'member';
    await setDoc(ref, {
      uid: user.uid,
      email: user.email,
      username: explicitUsername || user.displayName || user.email.split('@')[0],
      photoBase64: null,
      role,
      createdAt: serverTimestamp(),
      lastSeen: serverTimestamp()
    });
  } else {
    // Keep role in sync in case the admin email signs in after first ever login
    const data = snap.data();
    const shouldBeAdmin = user.email === ADMIN_EMAIL;
    if (shouldBeAdmin && data.role !== 'admin') {
      await updateDoc(ref, { role: 'admin' });
    }
  }
}

async function ensureDefaultChannels() {
  for (const name of DEFAULT_CHANNELS) {
    const ref = doc(db, 'channels', name);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { name, createdAt: serverTimestamp() }).catch(()=>{});
    }
  }
}

function heartbeat() {
  if (!currentUser) return;
  updateDoc(doc(db, 'users', currentUser.uid), { lastSeen: serverTimestamp() }).catch(()=>{});
}

function listenProfile(uid) {
  onSnapshot(doc(db, 'users', uid), (snap) => {
    if (!snap.exists()) return;
    profile = { uid, ...snap.data() };
    userCache[uid] = profile;
    $('me-name').innerHTML = escapeHtml(profile.username) + (profile.role === 'admin' ? ' <span class="crown">👑</span>' : '');
    $('me-role').textContent = profile.role === 'admin' ? 'Admin' : 'Member';
    renderAvatar($('me-avatar'), profile);
    renderAvatar($('settings-avatar'), profile);
  });
}

// ---------- channels ----------
function listenChannels() {
  const q = query(collection(db, 'channels'), orderBy('createdAt', 'asc'));
  unsubChannels = onSnapshot(q, (snap) => {
    const list = $('channel-list');
    list.innerHTML = '';
    snap.forEach(d => {
      const name = d.id;
      const li = document.createElement('li');
      li.className = 'channel-item' + (name === currentChannel ? ' active' : '');
      li.innerHTML = `<span class="hash">#</span><span>${escapeHtml(name)}</span>`;
      li.addEventListener('click', () => switchChannel(name));
      list.appendChild(li);
    });
    // admin-only create button visibility
    $('add-channel-btn').style.display = (profile && profile.role === 'admin') ? '' : 'none';
  }, handleFirestoreError('channels'));
}

function switchChannel(name) {
  currentChannel = name;
  $('chan-name').textContent = name;
  $('msg-input').placeholder = `Message #${name}`;
  document.querySelectorAll('.channel-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === name);
  });
  if (unsubMessages) unsubMessages();
  const q = query(collection(db, 'channels', name, 'messages'), orderBy('timestamp', 'asc'), limit(200));
  unsubMessages = onSnapshot(q, (snap) => {
    const wrap = $('messages');
    if (snap.empty) {
      wrap.innerHTML = `<div class="empty-state"><div class="bubble-mark"><svg width="40" height="40" viewBox="0 0 64 64" fill="none"><path d="M8 16C8 11.58 11.58 8 16 8H48C52.42 8 56 11.58 56 16V36C56 40.42 52.42 44 48 44H26L14 54V44H16C11.58 44 8 40.42 8 36V16Z" fill="currentColor"/><circle cx="21" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="32" cy="26" r="3.4" fill="var(--bg-alt)"/><circle cx="43" cy="26" r="3.4" fill="var(--bg-alt)"/></svg></div>No messages yet — say hi 👋</div>`;
      return;
    }
    wrap.innerHTML = '';
    let lastDay = null;
    snap.forEach(d => {
      const m = d.data();
      const ts = m.timestamp ? m.timestamp.toDate() : new Date();
      const dayKey = ts.toDateString();
      if (dayKey !== lastDay) {
        lastDay = dayKey;
        const div = document.createElement('div');
        div.className = 'day-divider';
        div.textContent = ts.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
        wrap.appendChild(div);
      }
      wrap.appendChild(renderMessage(d.id, m, ts));
    });
    wrap.scrollTop = wrap.scrollHeight;
  }, handleFirestoreError('messages'));
}

function renderMessage(id, m, ts) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  const av = document.createElement('img');
  av.className = 'avatar'; av.width = 38; av.height = 38; av.style.width='38px'; av.style.height='38px';
  renderAvatar(av, { uid: m.uid, username: m.username, photoBase64: m.photoBase64 });
  row.appendChild(av);

  const body = document.createElement('div');
  body.className = 'msg-body';
  const isAdmin = m.role === 'admin';
  const canDelete = profile && (profile.role === 'admin' || profile.uid === m.uid);
  body.innerHTML = `
    <div class="msg-head">
      <span class="msg-uname ${isAdmin ? 'admin' : ''}">${escapeHtml(m.username)}${isAdmin ? ' 👑' : ''}</span>
      <span class="msg-time">${ts.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      ${canDelete ? `<button class="msg-del" data-id="${id}">Delete</button>` : ''}
    </div>
    ${m.text ? `<div class="msg-text"></div>` : ''}
    ${m.imageBase64 ? `<img class="msg-img" src="${m.imageBase64}" />` : ''}
  `;
  if (m.text) body.querySelector('.msg-text').textContent = m.text;
  const delBtn = body.querySelector('.msg-del');
  if (delBtn) delBtn.addEventListener('click', () => deleteDoc(doc(db, 'channels', currentChannel, 'messages', id)).catch(()=>toast("Couldn't delete that message.")));
  const imgEl = body.querySelector('.msg-img');
  if (imgEl) imgEl.addEventListener('click', () => { $('lightbox-img').src = imgEl.src; $('lightbox').classList.add('open'); });

  row.appendChild(body);
  return row;
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('open'));

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- new channel ----------
$('add-channel-btn').addEventListener('click', () => {
  $('new-channel-name').value = '';
  $('channel-err').style.display = 'none';
  $('channel-backdrop').classList.add('open');
});
$('channel-cancel').addEventListener('click', () => $('channel-backdrop').classList.remove('open'));
$('channel-save').addEventListener('click', async () => {
  const raw = $('new-channel-name').value.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  const err = $('channel-err');
  if (!raw) { err.textContent = 'Give the channel a name.'; err.style.display = 'block'; return; }
  try {
    const ref = doc(db, 'channels', raw);
    const snap = await getDoc(ref);
    if (snap.exists()) { err.textContent = 'That channel already exists.'; err.style.display = 'block'; return; }
    await setDoc(ref, { name: raw, createdAt: serverTimestamp() });
    $('channel-backdrop').classList.remove('open');
    switchChannel(raw);
  } catch (e) {
    err.textContent = "Couldn't create the channel."; err.style.display = 'block';
  }
});

// ---------- members ----------
function listenMembers() {
  unsubMembers = onSnapshot(collection(db, 'users'), (snap) => {
    const list = [];
    snap.forEach(d => list.push({ uid: d.id, ...d.data() }));
    userCache = {};
    list.forEach(u => userCache[u.uid] = u);
    renderMembers(list);
  }, handleFirestoreError('members'));
  setInterval(() => renderMembers(Object.values(userCache)), 15000);
}
function renderMembers(list) {
  const now = Date.now();
  list.sort((a,b) => (a.username||'').localeCompare(b.username||''));
  $('member-count').textContent = `Members — ${list.length}`;
  const wrap = $('member-list');
  wrap.innerHTML = '';
  list.forEach(u => {
    const lastSeen = u.lastSeen && u.lastSeen.toDate ? u.lastSeen.toDate().getTime() : 0;
    const online = (now - lastSeen) < 45000;
    const row = document.createElement('div');
    row.className = 'member-row';
    const av = document.createElement('div');
    av.style.position = 'relative';
    const img = document.createElement('img');
    img.className = 'avatar'; img.width=32; img.height=32; img.style.width='32px'; img.style.height='32px';
    renderAvatar(img, u);
    av.appendChild(img);
    const dot = document.createElement('span');
    dot.className = 'status-dot ' + (online ? 'online' : 'offline');
    av.appendChild(dot);
    row.appendChild(av);
    const name = document.createElement('div');
    name.className = 'member-name' + (u.role === 'admin' ? ' admin' : '');
    name.innerHTML = escapeHtml(u.username) + (u.role === 'admin' ? ' 👑' : '');
    row.appendChild(name);
    wrap.appendChild(row);
  });
}

// ---------- composer ----------
const msgInput = $('msg-input');
msgInput.addEventListener('input', () => { msgInput.style.height = 'auto'; msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px'; });
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('send-btn').addEventListener('click', sendMessage);

$('attach-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    let quality = 0.7, dataUrl = await resizeImage(file, 1000, quality);
    while (dataUrl.length > 700000 && quality > 0.3) { quality -= 0.15; dataUrl = await resizeImage(file, 1000, quality); }
    if (dataUrl.length > 700000) { toast("That image is too large even after compressing — try a smaller one."); return; }
    pendingImage = dataUrl;
    $('img-preview').src = dataUrl;
    $('img-preview-wrap').style.display = 'flex';
  } catch (err) { toast(err.message); }
  e.target.value = '';
});
$('img-preview-clear').addEventListener('click', () => { pendingImage = null; $('img-preview-wrap').style.display = 'none'; });

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text && !pendingImage) return;
  if (!profile) return;
  const payload = {
    uid: profile.uid,
    username: profile.username,
    role: profile.role,
    photoBase64: profile.photoBase64 || null,
    text: text || null,
    imageBase64: pendingImage || null,
    timestamp: serverTimestamp()
  };
  msgInput.value = ''; msgInput.style.height = 'auto';
  const hadImage = !!pendingImage;
  pendingImage = null; $('img-preview-wrap').style.display = 'none';
  try {
    await addDoc(collection(db, 'channels', currentChannel, 'messages'), payload);
  } catch (e) {
    toast("Message failed to send" + (hadImage ? " — the image may be too large." : "."));
  }
}

// ---------- settings modal ----------
$('open-settings').addEventListener('click', () => {
  $('settings-username').value = profile.username;
  $('settings-err').style.display = 'none';
  $('settings-backdrop').classList.add('open');
});
$('settings-cancel').addEventListener('click', () => $('settings-backdrop').classList.remove('open'));
$('settings-upload-btn').addEventListener('click', () => $('settings-file-input').click());
let stagedAvatar = null;
$('settings-file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await resizeImage(file, 220, 0.85);
    stagedAvatar = dataUrl;
    $('settings-avatar').src = dataUrl;
  } catch (err) { toast(err.message); }
  e.target.value = '';
});
$('settings-save').addEventListener('click', async () => {
  const name = $('settings-username').value.trim();
  const err = $('settings-err');
  if (name.length < 2) { err.textContent = 'Username needs at least 2 characters.'; err.style.display = 'block'; return; }
  const updates = { username: name };
  if (stagedAvatar) updates.photoBase64 = stagedAvatar;
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), updates);
    stagedAvatar = null;
    $('settings-backdrop').classList.remove('open');
  } catch (e) {
    err.textContent = "Couldn't save changes."; err.style.display = 'block';
  }
});

// ---------- theme ----------
$('theme-btn').addEventListener('click', () => $('theme-menu').classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!e.target.closest('.theme-picker')) $('theme-menu').classList.remove('open');
});
document.querySelectorAll('.theme-opt').forEach(opt => {
  opt.addEventListener('click', () => setTheme(opt.dataset.theme));
});
function setTheme(t) {
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('yapp-theme', t);
  $('theme-menu').classList.remove('open');
}
setTheme(localStorage.getItem('yapp-theme') || 'yapp-dark');

// ---------- mobile toggles ----------
$('mobile-sidebar-toggle').addEventListener('click', () => $('sidebar').classList.toggle('open'));
$('mobile-members-toggle').addEventListener('click', () => $('members').classList.toggle('open'));
if (window.innerWidth <= 860) {
  $('mobile-sidebar-toggle').style.display = '';
  $('mobile-members-toggle').style.display = '';
}
</script>
</body>
</html>
