name: Install Yappathon voice chat

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'voice.js'
      - '.github/workflows/voice-install.yml'
      - 'firestore.rules'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install voice loader, context bridge, and Firestore rules
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          bridge = """\n// YAPPATHON VOICE CONTEXT BRIDGE\n// Exposes read-only getters for the separate voice module without\n// leaking mutable app state into the global namespace.\nwindow.YappathonVoiceContext = {\n  get db(){ return db; },\n  get currentUser(){ return currentUser; },\n  get profile(){ return profile; },\n  get userCache(){ return userCache; },\n  get dmCache(){ return dmCache; },\n  get currentConvoType(){ return currentConvoType; },\n  get currentDmId(){ return currentDmId; },\n  get currentChannel(){ return currentChannel; },\n  toast\n};\n"""
          loader = '<script type="module" src="./voice.js"></script>'
          text = text.replace(bridge, '')
          text = text.replace(loader, '')
          text = text.replace('<script type="module" src="./voice.js">\n</script>', '')
          text = text.replace('<script type="module" src="./voice.js">\n\n</script>', '')
          main_end = text.rfind('</script>')
          if main_end < 0:
              raise SystemExit('main inline module closing tag not found')
          text = text[:main_end] + bridge + '\n' + text[main_end:]
          text = text.replace('</body>', loader + '\n</body>', 1)
          index.write_text(text, encoding='utf-8')

          rules = Path('firestore.rules')
          r = rules.read_text(encoding='utf-8')
          marker = '// YAPPATHON VOICE CHAT RULES'
          if marker in r:
              # Repair any literal backslash-n sequences left by older runs.
              if '\\n' in r:
                  r = r.replace('\\n', '\n')
                  rules.write_text(r, encoding='utf-8')
          else:
              block = "\n\n    // YAPPATHON VOICE CHAT RULES\n    // WebRTC media stays peer-to-peer. Firestore stores only call state,\n    // invitations, presence and signaling messages.\n    match /voiceCalls/{callId} {\n      function callParticipant() {\n        return isSignedIn() && (\n          resource.data.kind == 'channel'\n          || request.auth.uid in resource.data.members\n        );\n      }\n\n      allow read: if callParticipant();\n\n      allow create: if isSignedIn()\n        && request.resource.data.createdBy == request.auth.uid\n        && request.resource.data.active == true\n        && request.resource.data.kind in ['channel', 'dm', 'group']\n        && request.resource.data.contextId is string\n        && request.resource.data.name is string\n        && request.resource.data.members is list\n        && (\n          (request.resource.data.kind == 'channel'\n            && request.resource.data.members.size() == 0\n            && callId == 'channel_' + request.resource.data.contextId)\n          ||\n          (request.resource.data.kind == 'dm'\n            && request.auth.uid in request.resource.data.members\n            && request.resource.data.members.size() == 2\n            && callId == 'call_' + request.resource.data.contextId)\n          ||\n          (request.resource.data.kind == 'group'\n            && request.auth.uid in request.resource.data.members\n            && request.resource.data.members.size() >= 3\n            && request.resource.data.members.size() <= 20\n            && callId == 'call_' + request.resource.data.contextId)\n        );\n\n      allow update: if callParticipant()\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['active', 'updatedAt', 'endedAt']);\n\n      allow delete: if false;\n\n      match /invites/{uid} {\n        allow read: if isSignedIn() && (\n          request.auth.uid == uid\n          || request.auth.uid in get(/databases/$(database)/documents/voiceCalls/$(callId)).data.members\n          || get(/databases/$(database)/documents/voiceCalls/$(callId)).data.createdBy == request.auth.uid\n        );\n\n        allow create: if isSignedIn()\n          && request.auth.uid == get(/databases/$(database)/documents/voiceCalls/$(callId)).data.createdBy\n          && uid in get(/databases/$(database)/documents/voiceCalls/$(callId)).data.members\n          && request.resource.data.uid == uid\n          && request.resource.data.status == 'ringing';\n\n        allow update: if isSignedIn()\n          && request.auth.uid == uid\n          && request.resource.data.uid == resource.data.uid\n          && request.resource.data.status in ['accepted', 'declined', 'ringing'];\n\n        allow delete: if false;\n      }\n\n      match /presence/{uid} {\n        allow read: if callParticipant();\n        allow create, update: if isSignedIn()\n          && request.auth.uid == uid\n          && callParticipant()\n          && request.resource.data.uid == uid;\n        allow delete: if isSignedIn() && request.auth.uid == uid;\n      }\n\n      match /signals/{signalId} {\n        allow read: if callParticipant();\n        allow create: if callParticipant()\n          && request.resource.data.from == request.auth.uid\n          && request.resource.data.to is string\n          && request.resource.data.type in ['offer', 'answer', 'candidate'];\n        allow update, delete: if false;\n      }\n    }\n"
              pos = r.rfind('}')
              if pos < 0:
                  raise SystemExit('firestore.rules has no closing brace')
              r = r[:pos] + block + r[pos:]
              rules.write_text(r, encoding='utf-8')

      - name: Commit installed voice chat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html firestore.rules
          if git diff --cached --quiet; then
            echo 'Voice chat already installed.'
            exit 0
          fi
          git commit -m 'Add Yappathon voice chat support'
          git push
