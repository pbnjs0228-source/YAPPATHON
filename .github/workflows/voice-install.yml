name: Install Yappathon voice chat

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'voice.js'
      - '.github/workflows/voice-install.yml'
      - 'firestore.rules'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install voice loader, context bridge, and Firestore rules
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          bridge = '''
// YAPPATHON VOICE CONTEXT BRIDGE
// Exposes read-only getters for the separate voice module without
// leaking mutable app state into the global namespace.
window.YappathonVoiceContext = {
  get db(){ return db; },
  get currentUser(){ return currentUser; },
  get profile(){ return profile; },
  get userCache(){ return userCache; },
  get dmCache(){ return dmCache; },
  get currentConvoType(){ return currentConvoType; },
  get currentDmId(){ return currentDmId; },
  get currentChannel(){ return currentChannel; },
  toast
};
'''

          # Repair any malformed copy from an earlier installer run.
          text = text.replace(bridge, '')
          text = text.replace('<script type="module" src="./voice.js">\n</script>', '<script type="module" src="./voice.js"></script>')
          text = text.replace('<script type="module" src="./voice.js">\n\n</script>', '<script type="module" src="./voice.js"></script>')

          loader = '<script type="module" src="./voice.js"></script>'
          if loader not in text:
              text = text.replace('</body>', loader + '\n</body>', 1)

          loader_pos = text.find(loader)
          if loader_pos < 0:
              raise SystemExit('voice loader missing')
          main_end = text.rfind('</script>', 0, loader_pos)
          if main_end < 0:
              raise SystemExit('main inline module closing tag not found')
          text = text[:main_end] + bridge + '\n' + text[main_end:]
          index.write_text(text, encoding='utf-8')

          rules = Path('firestore.rules')
          r = rules.read_text(encoding='utf-8')
          marker = '// YAPPATHON VOICE CHAT RULES'
          if marker not in r:
              block = r'''

    // YAPPATHON VOICE CHAT RULES
    // WebRTC media stays peer-to-peer. Firestore stores only call state,
    // invitations, presence and signaling messages.
    match /voiceCalls/{callId} {
      function callParticipant() {
        return isSignedIn() && (
          resource.data.kind == 'channel'
          || request.auth.uid in resource.data.members
        );
      }

      allow read: if callParticipant();

      allow create: if isSignedIn()
        && request.resource.data.createdBy == request.auth.uid
        && request.resource.data.active == true
        && request.resource.data.kind in ['channel', 'dm', 'group']
        && request.resource.data.contextId is string
        && request.resource.data.name is string
        && request.resource.data.members is list
        && (
          (request.resource.data.kind == 'channel'
            && request.resource.data.members.size() == 0
            && callId == 'channel_' + request.resource.data.contextId)
          ||
          (request.resource.data.kind == 'dm'
            && request.auth.uid in request.resource.data.members
            && request.resource.data.members.size() == 2
            && callId == 'call_' + request.resource.data.contextId)
          ||
          (request.resource.data.kind == 'group'
            && request.auth.uid in request.resource.data.members
            && request.resource.data.members.size() >= 3
            && request.resource.data.members.size() <= 20
            && callId == 'call_' + request.resource.data.contextId)
        );

      allow update: if callParticipant()
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['active', 'updatedAt', 'endedAt']);

      allow delete: if false;

      match /invites/{uid} {
        allow read: if isSignedIn() && (
          request.auth.uid == uid
          || request.auth.uid in get(/databases/$(database)/documents/voiceCalls/$(callId)).data.members
          || get(/databases/$(database)/documents/voiceCalls/$(callId)).data.createdBy == request.auth.uid
        );

        allow create: if isSignedIn()
          && request.auth.uid == get(/databases/$(database)/documents/voiceCalls/$(callId)).data.createdBy
          && uid in get(/databases/$(database)/documents/voiceCalls/$(callId)).data.members
          && request.resource.data.uid == uid
          && request.resource.data.status == 'ringing';

        allow update: if isSignedIn()
          && request.auth.uid == uid
          && request.resource.data.uid == resource.data.uid
          && request.resource.data.status in ['accepted', 'declined', 'ringing'];

        allow delete: if false;
      }

      match /presence/{uid} {
        allow read: if callParticipant();
        allow create, update: if isSignedIn()
          && request.auth.uid == uid
          && callParticipant()
          && request.resource.data.uid == uid;
        allow delete: if isSignedIn() && request.auth.uid == uid;
      }

      match /signals/{signalId} {
        allow read: if callParticipant();
        allow create: if callParticipant()
          && request.resource.data.from == request.auth.uid
          && request.resource.data.to is string
          && request.resource.data.type in ['offer', 'answer', 'candidate'];
        allow update, delete: if false;
      }
    }
'''
              pos = r.rfind('}')
              if pos < 0:
                  raise SystemExit('firestore.rules has no closing brace')
              r = r[:pos] + block + r[pos:]
              rules.write_text(r, encoding='utf-8')

      - name: Commit installed voice chat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html firestore.rules
          if git diff --cached --quiet; then
            echo 'Voice chat already installed.'
            exit 0
          fi
          git commit -m 'Add Yappathon voice chat support'
          git push
