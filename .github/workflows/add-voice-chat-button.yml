name: Add Voice Chat button to index.html

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/add-voice-chat-button.yml'

permissions:
  contents: write

jobs:
  ensure-voice-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Insert button directly into index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="enter-voice-chat-button"' not in s:
              block='''\n<style id="voice-chat-button-style">\n#enter-voice-chat-button{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:10px 16px;padding:10px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--text);font:700 13px/1.2 Inter,sans-serif;cursor:pointer;transition:.15s}\n#enter-voice-chat-button:hover{background:var(--accent);color:var(--accent-contrast);transform:translateY(-1px);box-shadow:0 6px 20px var(--shadow)}\n#enter-voice-chat-button:active{transform:translateY(0) scale(.98)}\n</style>\n<button id="enter-voice-chat-button" type="button">🎙️ ENTER VOICE CHAT</button>\n<script>document.getElementById('enter-voice-chat-button').addEventListener('click',function(){window.location.href='https://pbnjs0228-source.github.io/YAPPATHON-Cafe/';});</script>\n'''
              i=s.lower().rfind('</body>')
              if i<0: raise SystemExit('No closing body tag found')
              s=s[:i]+block+s[i:]
              p.write_text(s,encoding='utf-8')
          else:
              print('button already present')
          PY
      - name: Commit the HTML change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add ENTER VOICE CHAT directly to index.html [skip ci]'
          git push
