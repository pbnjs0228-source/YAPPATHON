name: Move Voice Chat button into sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move button into sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<style>\n  #enter-voice-chat-button')
          if start == -1:
              raise SystemExit('Voice button block not found')
          end = s.find('</script>\n\n</body>', start)
          if end == -1:
              raise SystemExit('Voice button block end not found')
          end += len('</script>')
          block = s[start:end]
          s = s[:start] + s[end:]
          # Put the existing HTML button directly inside the sidebar, above the spacer.
          marker = '    <div class="sidebar-spacer"></div>'
          if marker not in s:
              raise SystemExit('Sidebar spacer not found')
          s = s.replace(marker, '    ' + block.replace('\n', '\n    ') + '\n\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit HTML change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Fix Enter Voice Chat button placement'
          git push
