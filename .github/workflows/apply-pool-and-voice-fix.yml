name: Apply pool and voice fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pool-and-voice-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app and rules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix the generated pool module syntax and make the simulation a
          # little more physical: softer cushion response and proper impulse
          # restitution for ball-ball collisions.
          pool = Path('pool.js')
          s = pool.read_text(encoding='utf-8')
          s = s.replace("else actions.innerHTML='<div class=\"pool-status\">Waiting for the host to start…</div>''}}", "else actions.innerHTML='<div class=\"pool-status\">Waiting for the host to start…</div>'}")
          s = s.replace("const W=1000,H=520,BALL=11,POCKET=24,FRICTION=0.985,REST=5,MAX_SPEED=1150;", "const W=1000,H=520,BALL=11,POCKET=24,FRICTION=0.991,REST=5,MAX_SPEED=1050; const RAIL_RESTITUTION=0.82, BALL_RESTITUTION=0.94;")
          s = s.replace("b.vx=Math.abs(b.vx)*.92", "b.vx=Math.abs(b.vx)*RAIL_RESTITUTION")
          s = s.replace("b.vx=-Math.abs(b.vx)*.92", "b.vx=-Math.abs(b.vx)*RAIL_RESTITUTION")
          s = s.replace("b.vy=Math.abs(b.vy)*.92", "b.vy=Math.abs(b.vy)*RAIL_RESTITUTION")
          s = s.replace("b.vy=-Math.abs(b.vy)*.92", "b.vy=-Math.abs(b.vy)*RAIL_RESTITUTION")
          old = "if(rel<0){const imp=-rel;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}"
          new = "if(rel<0){const imp=-(1+BALL_RESTITUTION)*rel/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}"
          if old in s:
              s=s.replace(old,new,1)
          pool.write_text(s,encoding='utf-8')

          # Inject the pool module and fix the false 'call ended' detection.
          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          if './pool.js' not in s:
              s=s.replace('</body>', '<script type="module" src="./pool.js"></script>\n</body>', 1)
          s=s.replace('<span class="badge-soon">Soon</span></div>', '<span class="badge-soon">Pool</span></div>', 1)
          old = 'stopCallWatch=onSnapshot(callRef(call),snap=>{if(!activeCall||activeCall.id!==call)return;if(!snap.exists()||snap.data().active!==true||!fresh(snap.data().updatedAt))leave()});'
          new = 'stopCallWatch=onSnapshot(callRef(call),snap=>{if(!activeCall||activeCall.id!==call)return;if(!snap.exists()||snap.data().active!==true)leave()});'
          if old not in s:
              raise SystemExit('voice watchCall marker not found')
          s=s.replace(old,new,1)
          old = 'if(old.exists()&&old.data().active&&fresh(old.data().updatedAt)){if(c.type=="channel")return joinCall(cid,c,old.data());toast("A call is already active here.");return}'
          new = 'if(old.exists()&&old.data().active){if(c.type=="channel")return joinCall(cid,c,old.data());toast("A call is already active here.");return}'
          if old not in s:
              raise SystemExit('voice active-call freshness marker not found')
          s=s.replace(old,new,1)
          index.write_text(s,encoding='utf-8')

          # Add rules for the four-player pool lobby/game state.
          rules=Path('firestore.rules')
          rs=rules.read_text(encoding='utf-8')
          if 'match /poolRooms/{roomId}' not in rs:
              block='''
          // MULTIPLAYER POOL
          match /poolRooms/{roomId} {
            allow read: if signedIn();

            allow create: if signedIn()
              && request.resource.data.hostUid == request.auth.uid
              && request.resource.data.status == 'lobby'
              && request.resource.data.playerCount == 0
              && request.resource.data.playerIds is list
              && request.resource.data.playerIds.size() == 0;

            allow update: if signedIn() && (
              (
                request.auth.uid == resource.data.hostUid
                && request.resource.data.diff(resource.data).affectedKeys()
                  .hasOnly(['status','startedAt','state','turn'])
              )
              ||
              (
                resource.data.status == 'lobby'
                && request.resource.data.status == 'lobby'
                && request.auth.uid in request.resource.data.playerIds
                && !(request.auth.uid in resource.data.playerIds)
                && request.resource.data.playerCount == resource.data.playerCount + 1
                && request.resource.data.playerCount <= 4
                && request.resource.data.playerIds.size() == request.resource.data.playerCount
              )
            );

            allow delete: if signedIn() && request.auth.uid == resource.data.hostUid;

            match /players/{uid} {
              allow read: if signedIn();
              allow create, update: if signedIn()
                && request.auth.uid == uid
                && request.resource.data.uid == uid;
              allow delete: if signedIn() && request.auth.uid == uid;
            }
          }
          '''
              idx=rs.rfind('\n}')
              if idx<0: raise SystemExit('rules closing brace not found')
              rs=rs[:idx]+block+rs[idx:]
              rules.write_text(rs,encoding='utf-8')
          PY

      - name: Commit final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pool.js firestore.rules
          git commit -m 'Add multiplayer pool and fix false voice call exits' || exit 0
          git push
